name: Deploy Godot Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Godot 4.7.2 and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          release=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          engine=Godot_v4.7.2-stable_linux.x86_64
          templates=Godot_v4.7.2-stable_export_templates.tpz
          curl --fail --silent --show-error --location --retry 3 --proto '=https' "$release/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          for asset in "$engine.zip" "$templates"; do
            curl --fail --silent --show-error --location --retry 3 --proto '=https' "$release/$asset" -o "$asset"
            awk -v asset="$asset" '$2 == asset { print }' SHA512-SUMS.txt | sha512sum --check --strict
          done
          unzip -q "$engine.zip" "$engine"
          chmod +x "$engine"
          unzip -q "$templates" templates/web_nothreads_debug.zip templates/web_nothreads_release.zip
          template_dir="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates/4.7.2.stable"
          mkdir -p "$template_dir"
          mv templates/web_nothreads_debug.zip templates/web_nothreads_release.zip "$template_dir/"
          printf 'GODOT_BIN=%s/%s\n' "$RUNNER_TEMP" "$engine" >> "$GITHUB_ENV"

      - name: Run regression and UI suites and export the Web release
        run: bash .github/scripts/build-web.sh

      - name: Upload the Web export
        uses: actions/upload-pages-artifact@4cc19c7d3f3e6c87c68366501382a03c8b1ba6db # v4
        with:
          path: web-build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@5ab929b0772a9c574971c2357565e79163c9088f # v4
