[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="browser/*, web-build/*, *_test.gd"
export_path="web-build/index.html"
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://browser/online_business_loader.html"
html/head_include="<meta name=\"theme-color\" content=\"#0c121c\">\n<style>\nhtml, body, #canvas { background: #0c121c; overscroll-behavior: none; }\n#canvas { touch-action: none; }\n</style>\n<script>\n// Godot 4.7.2 sets a lowercase JS property on its virtual keyboard input.\n// Reflect it as the standard DOM property so browsers can select a keypad.\ndocument.addEventListener('focusin', ({ target }) => {\n  if (target instanceof HTMLInputElement && typeof target.inputmode === 'string') {\n    target.inputMode = target.inputmode;\n  }\n});\n</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=false
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
