<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="dark">
	<title>$GODOT_PROJECT_NAME</title>
	$GODOT_HEAD_INCLUDE
	<style>
		:root {
			color-scheme: dark;
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			--font-caption: 11px; --font-button: 12px; --font-body: 13px; --font-heading: 14px;
			--navy-950: #070c14; --navy-900: #0c1420; --navy-800: #111e2e;
			--gold: #d9b468; --gold-bright: #f1d394; --ivory: #f1eee5; --muted: #b0bbc9;
		}
		* { box-sizing: border-box; }
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
		body {
			color: var(--ivory); background:
				radial-gradient(ellipse at 72% 55%, rgba(31, 77, 117, .22), transparent 45%),
				radial-gradient(ellipse at 16% 7%, rgba(47, 73, 102, .2), transparent 38%),
				linear-gradient(135deg, var(--navy-950), var(--navy-900) 54%, #0b1724);
			touch-action: manipulation;
		}
		#preview-host { position: fixed; inset: 0; overflow: hidden; display: grid; place-items: center; }
		#game-preview-frame { position: relative; width: 100vw; height: 100vh; transform-origin: top left; overflow: hidden; }
		/* iOS Safari keeps the layout viewport behind its software keyboard. The
		   script below sizes the game to the visual viewport while it is reduced. */
		#preview-host.uses-visual-viewport { inset: auto; }
		#preview-host.uses-visual-viewport #game-preview-frame { width: 100%; height: 100%; }
		#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: transparent; }
		#dev-toolbar { position: fixed; z-index: 5; top: env(safe-area-inset-top, 0px); left: 0; right: 0; min-height: 48px; display: none; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 6px 12px; background: rgba(7, 12, 20, .98); border-bottom: 1px solid rgba(217,180,104,.45); box-shadow: 0 4px 20px rgba(0,0,0,.3); color: #f1eee5; font: 600 13px/1.2 Inter, ui-sans-serif, system-ui, sans-serif; }
		#dev-toolbar.is-visible { display: flex; }
		.dev-button { appearance: none; min-height: 36px; padding: 0 12px; border: 1px solid rgba(217,180,104,.55); border-radius: 6px; background: #111e2e; color: #f1eee5; font: inherit; cursor: pointer; }
		.dev-button[aria-pressed="true"] { background: #d9b468; color: #11151b; }
		#dev-preview-name { color: #d9b468; min-width: 90px; text-align: center; }
		body.dev-preview #preview-host { inset: var(--dev-toolbar-bottom, 48px) 0 0; }
		body.dev-preview #game-preview-frame { position: absolute; }
		@media (max-width: 520px) { #dev-toolbar { gap: 4px; padding-inline: 4px; } .dev-button { min-height: 38px; padding: 0 8px; font-size: 12px; } #dev-preview-name { display: none; } }
		.loader {
			position: fixed; inset: 0; z-index: 2; display: grid; place-items: center;
			padding: max(24px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left));
			background:
				linear-gradient(rgba(100, 132, 160, .035) 1px, transparent 1px),
				linear-gradient(90deg, rgba(100, 132, 160, .035) 1px, transparent 1px),
				radial-gradient(ellipse at 75% 50%, rgba(37, 81, 119, .17), transparent 45%),
				linear-gradient(132deg, #070c14 0%, #0b1420 58%, #0d1a28 100%);
			background-size: 54px 54px, 54px 54px, auto, auto;
			opacity: 1; transition: opacity .42s ease, visibility .42s ease;
		}
		.loader.is-ready { opacity: 0; visibility: hidden; pointer-events: none; }
		.skyline { position: absolute; inset: auto 0 0; width: 100%; height: min(42vh, 360px); opacity: .27; pointer-events: none; }
		.stage { position: relative; width: min(100%, 1260px); display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(300px, .95fr); align-items: center; gap: clamp(24px, 6vw, 90px); }
		.hero-copy { grid-column: 1; grid-row: 1; z-index: 1; max-width: 650px; padding: clamp(8px, 2vh, 24px) 0; }
		.brand { margin: 0; font-size: var(--font-heading); line-height: 1.25; font-weight: 700; letter-spacing: .2em; color: var(--gold-bright); }
		.compact-tagline { display: none; }
		.presents { margin: 7px 0 clamp(24px, 4vh, 42px); font-size: var(--font-caption); line-height: 1; letter-spacing: .38em; color: #aeb9c5; }
		.title { margin: 0; display: flex; flex-direction: column; align-items: flex-start; gap: .02em; font-size: var(--font-heading); line-height: 1.1; letter-spacing: .055em; font-weight: 750; }
		.title span:last-child { color: var(--gold-bright); }
		.tagline { margin: clamp(20px, 3vh, 30px) 0 0; color: #d3d9df; font-size: var(--font-body); letter-spacing: .015em; }
		.creator { margin: 10px 0 0; color: #aeb9c5; font-size: var(--font-body); letter-spacing: .04em; }
		.creator strong { color: var(--ivory); font-weight: 650; }
		.growth-logo { grid-column: 2; grid-row: 1; justify-self: center; width: min(100%, clamp(250px, 34vw, 440px)); aspect-ratio: 1; filter: drop-shadow(0 0 36px rgba(217, 180, 104, .11)); }
		.loader-footer { position: absolute; left: max(28px, env(safe-area-inset-left)); bottom: max(30px, env(safe-area-inset-bottom)); width: min(460px, calc(100% - 56px)); z-index: 1; }
		.loading-line { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 10px; font-size: var(--font-button); letter-spacing: .04em; }
		#loading-status { color: #d6dce2; }
		#loading-percent { color: var(--gold-bright); font-variant-numeric: tabular-nums; }
		.progress-track { height: 5px; overflow: hidden; border: 1px solid rgba(217, 180, 104, .42); border-radius: 999px; background: rgba(255, 255, 255, .07); }
		.progress-fill { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ad843e, #f1d394 72%, #fff0c7); box-shadow: 0 0 12px rgba(241, 211, 148, .28); transition: width .18s ease; }
		.progress-track.is-indeterminate .progress-fill { width: 31%; animation: loading-sweep 1.35s ease-in-out infinite; }
		.error-panel { display: none; margin-top: 16px; border: 1px solid rgba(231, 113, 104, .55); border-radius: 8px; padding: 14px 16px; color: #ffe2dd; background: rgba(78, 24, 28, .58); font-size: var(--font-body); line-height: 1.45; }
		.error-panel.is-visible { display: block; }
		.error-panel p { margin: 0 0 12px; overflow-wrap: anywhere; }
		.retry-button { appearance: none; border: 1px solid #dfbd76; border-radius: 6px; background: #d2aa5d; color: #14171a; font: inherit; font-weight: 700; min-height: 42px; padding: 0 20px; cursor: pointer; }
		.retry-button:hover { background: #f0d38f; }
		.retry-button:focus-visible { outline: 3px solid #fff0c7; outline-offset: 3px; }
		@keyframes loading-sweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(330%); } }
		@media (max-width: 900px) and (orientation: landscape) {
			.stage { grid-template-columns: minmax(0, 1.1fr) minmax(230px, .8fr); gap: 24px; width: min(100%, 1020px); }
			.growth-logo { width: min(100%, 300px); }
			.title { font-size: var(--font-heading); }
			.presents { margin-bottom: 18px; }
			.tagline { margin-top: 14px; }
			.loader-footer { bottom: max(20px, env(safe-area-inset-bottom)); }
		}
		@media (max-width: 760px), (orientation: portrait) and (max-width: 900px) {
			.loader { padding: max(18px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
			.stage { width: min(100%, 520px); display: flex; flex-direction: column; gap: clamp(12px, 2.3vh, 24px); text-align: center; }
			.growth-logo { order: 0; width: clamp(132px, 31vh, 220px); }
			.hero-copy { order: 1; max-width: none; padding: 0; }
			.brand { font-size: var(--font-heading); letter-spacing: .19em; }
			.presents { margin: 6px 0 17px; font-size: var(--font-caption); }
			.title { align-items: center; gap: .04em; font-size: var(--font-heading); }
			.desktop-tagline { display: none; }
			.compact-tagline { display: inline; }
			.tagline { margin-top: 14px; font-size: var(--font-body); }
			.creator { margin-top: 8px; font-size: var(--font-body); }
			.loader-footer { position: absolute; left: max(20px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom)); width: calc(100% - 40px); }
		}
		@media (max-width: 380px) and (orientation: portrait) {
			.stage { gap: 8px; }
			.growth-logo { width: clamp(108px, 25vh, 150px); }
			.title { font-size: var(--font-heading); }
			.presents { margin-bottom: 13px; }
			.tagline { margin-top: 10px; }
		}
		@media (max-height: 520px) and (orientation: landscape) {
			.loader { padding-top: 10px; padding-bottom: 10px; }
			.stage { gap: 14px; }
			.growth-logo { width: min(42vh, 220px); }
			.title { font-size: var(--font-heading); }
			.brand { font-size: 11px; }
			.presents { margin: 5px 0 12px; }
			.tagline { margin-top: 9px; font-size: var(--font-body); }
			.creator { margin-top: 5px; }
			.loader-footer { bottom: 12px; }
		}
		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
		}
	</style>
</head>
<body>
	<div id="preview-host"><div id="game-preview-frame"><canvas id="canvas" aria-label="Online Business Tycoon game">Your browser does not support the canvas tag.</canvas></div></div>
	<div id="dev-toolbar" role="toolbar" aria-label="Developer device preview controls" hidden>
		<span id="dev-preview-name">Desktop</span>
		<button class="dev-button" type="button" data-preview="desktop" aria-pressed="true">Desktop</button>
		<button class="dev-button" type="button" data-preview="tablet" aria-pressed="false">Tablet</button>
		<button class="dev-button" type="button" data-preview="mobile" aria-pressed="false">Mobile</button>
		<button id="dev-exit" class="dev-button" type="button">Exit Preview</button>
	</div>
	<noscript><p style="position:fixed;z-index:4;inset:0;background:#080d15;color:#fff;padding:2rem">Online Business Tycoon requires JavaScript to run.</p></noscript>
	<div id="loader" class="loader" role="region" aria-label="Loading Online Business Tycoon">
		<svg class="skyline" viewBox="0 0 1440 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
			<defs><linearGradient id="skylineFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27415a" stop-opacity=".04"/><stop offset="1" stop-color="#06101a" stop-opacity=".9"/></linearGradient></defs>
			<path fill="url(#skylineFade)" d="M0 400V300h42v-44h58v44h22V210h38v-29h12V110h22v71h12v50h18v69h29v-88h26v-30h13v-61h11V75h25v46h10v61h15v73h30v-95h19v-51h17v51h15v110h24v-54h26v-82h14v-43h11v43h16v136h27v-97h20v-38h14v-65h10v-60h20v60h11v65h18v135h26v-78h28v-38h16v-73h18v-39h26v39h18v73h21v116h23v-62h22v-77h12v-42h12v42h18v139h24v-90h20v-37h16v-78h15v-58h23v58h15v78h22v127h26v-48h19v-86h11v-45h17v45h15v134h26v-75h24v-48h19v-68h14v-52h26v52h15v68h20v123h34v-96h29v-43h15v-62h17v62h18v139h23v-48h44v148z"/>
			<g fill="#d9b468" opacity=".12"><path d="M183 137h4v8h-4zm7 0h4v8h-4zm58 72h4v8h-4zm15 0h4v8h-4zm81-74h4v8h-4zm8 0h4v8h-4zm94 61h4v8h-4zm16 0h4v8h-4zm97-56h4v8h-4zm10 0h4v8h-4zm90 59h4v8h-4zm16 0h4v8h-4zm105-76h4v8h-4zm12 0h4v8h-4zm102 86h4v8h-4zm11 0h4v8h-4zm97-82h4v8h-4zm12 0h4v8h-4z"/></g>
		</svg>
		<main class="stage" aria-label="Online Business Tycoon loading">
			<svg class="growth-logo" viewBox="0 0 420 420" role="img" aria-label="Gold business growth bars and rising arrow">
				<defs>
					<linearGradient id="goldMetal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0c8"/><stop offset=".42" stop-color="#e7c477"/><stop offset="1" stop-color="#a9792e"/></linearGradient>
					<radialGradient id="logoGlow"><stop stop-color="#d6ad5d" stop-opacity=".17"/><stop offset="1" stop-color="#d6ad5d" stop-opacity="0"/></radialGradient>
					<filter id="goldGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
				</defs>
				<circle cx="210" cy="210" r="198" fill="url(#logoGlow)"/>
				<circle cx="210" cy="210" r="172" fill="none" stroke="url(#goldMetal)" stroke-opacity=".36" stroke-width="2"/>
				<circle cx="210" cy="210" r="157" fill="none" stroke="#d9b468" stroke-opacity=".16" stroke-width="1"/>
				<path d="M88 292h244" stroke="#d9b468" stroke-opacity=".26" stroke-width="2"/>
				<g fill="url(#goldMetal)" filter="url(#goldGlow)"><rect x="105" y="245" width="42" height="47" rx="4"/><rect x="165" y="207" width="42" height="85" rx="4"/><rect x="225" y="166" width="42" height="126" rx="4"/></g>
				<path d="M112 208 177 161l51 18 74-83" fill="none" stroke="url(#goldMetal)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)"/>
				<path d="m279 96 25-4-3 27" fill="none" stroke="url(#goldMetal)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)"/>
				<circle cx="112" cy="208" r="6" fill="#f3d895"/><circle cx="177" cy="161" r="6" fill="#f3d895"/>
			</svg>
			<section class="hero-copy">
				<p class="brand">UR TRADE NETWORK</p>
				<p class="presents">PRESENTS</p>
				<h1 class="title"><span>ONLINE</span><span>BUSINESS</span><span>TYCOON</span></h1>
				<p class="tagline"><span class="desktop-tagline">From your first sale to a global business empire.</span><span class="compact-tagline">Build. Grow. Expand.</span></p>
				<p class="creator">A Game by <strong>UphyRaop</strong></p>
			</section>
		</main>
		<footer class="loader-footer">
			<div class="loading-line"><span id="loading-status" role="status" aria-live="polite">Initializing engine…</span><span id="loading-percent">—</span></div>
			<div id="progress-track" class="progress-track is-indeterminate" role="progressbar" aria-label="Game loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Initializing engine…"><span id="progress-fill" class="progress-fill"></span></div>
			<div id="error-panel" class="error-panel" role="alert" aria-live="assertive"><p id="error-message">The game could not be loaded.</p><button id="retry-button" class="retry-button" type="button">Retry</button></div>
		</footer>
	</div>
	<script src="$GODOT_URL"></script>
	<script>
		'use strict';
		const GODOT_CONFIG = $GODOT_CONFIG;
		const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
		const loader = document.getElementById('loader');
		const statusText = document.getElementById('loading-status');
		const percentText = document.getElementById('loading-percent');
		const progressTrack = document.getElementById('progress-track');
		const progressFill = document.getElementById('progress-fill');
		const errorPanel = document.getElementById('error-panel');
		const errorMessage = document.getElementById('error-message');
		const retryButton = document.getElementById('retry-button');
		let startAttempted = false;
		const previewFrame = document.getElementById('game-preview-frame');
		const previewHost = document.getElementById('preview-host');
		const devToolbar = document.getElementById('dev-toolbar');
		const devPreviewName = document.getElementById('dev-preview-name');
		const previewPresets = { desktop: [900, 1200], tablet: [768, 1024], mobile: [390, 844] };
		let devEnabled = false;
		let previewActive = false;
		let selectedPreview = 'desktop';
		let savedWindowSize = null;
		let visualViewportWindowSize = null;
		let visualViewportFrame = 0;

		function applyPreview() {
			if (!previewActive) return;
			const [width, height] = previewPresets[selectedPreview];
			const hostRect = previewHost.getBoundingClientRect();
			const toolbarHeight = devToolbar.getBoundingClientRect().height;
			document.body.style.setProperty('--dev-toolbar-bottom', (toolbarHeight + parseFloat(getComputedStyle(devToolbar).top || '0')) + 'px');
			const scale = Math.min(hostRect.width / width, hostRect.height / height);
			Object.defineProperty(window, 'innerWidth', { configurable: true, value: width });
			Object.defineProperty(window, 'innerHeight', { configurable: true, value: height });
			previewFrame.style.width = width + 'px';
			previewFrame.style.height = height + 'px';
			previewFrame.style.transform = 'scale(' + scale + ')';
			previewFrame.style.left = Math.max(0, (hostRect.width - width * scale) / 2) + 'px';
			previewFrame.style.top = Math.max(0, (hostRect.height - height * scale) / 2) + 'px';
			requestLogicalSize(width, height);
			devPreviewName.textContent = selectedPreview[0].toUpperCase() + selectedPreview.slice(1) + ' · ' + width + ' × ' + height;
			devToolbar.querySelectorAll('[data-preview]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.preview === selectedPreview)));
		}
		function requestLogicalSize(width, height) {
			if (typeof window.obtSetPreviewLogicalSize === 'function') window.obtSetPreviewLogicalSize(width, height);
		}
		function notifyGameResize() { window.dispatchEvent(new Event('resize')); }
		function syncVisualViewport(notifyGodot = false) {
			if (previewActive || !window.visualViewport) return;
			if (visualViewportFrame) cancelAnimationFrame(visualViewportFrame);
			visualViewportFrame = requestAnimationFrame(() => {
				visualViewportFrame = 0;
				const viewport = window.visualViewport;
				if (!viewport || previewActive) return;
				const width = Math.max(1, Math.round(viewport.width));
				const height = Math.max(1, Math.round(viewport.height));
				const layoutHeight = visualViewportWindowSize ? visualViewportWindowSize.layoutHeight : window.innerHeight;
				const reduced = height < layoutHeight - 80 || Math.abs(viewport.offsetTop) > 1 || Math.abs(viewport.offsetLeft) > 1;
				if (reduced) {
					if (!visualViewportWindowSize) {
						visualViewportWindowSize = {
							width: Object.getOwnPropertyDescriptor(window, 'innerWidth'),
							height: Object.getOwnPropertyDescriptor(window, 'innerHeight'),
							layoutHeight: window.innerHeight,
							frameStyle: {
								width: previewFrame.style.width, height: previewFrame.style.height,
								position: previewFrame.style.position, left: previewFrame.style.left,
								top: previewFrame.style.top, transform: previewFrame.style.transform
							}
						};
					}
					previewHost.classList.add('uses-visual-viewport');
					previewHost.style.left = Math.round(viewport.offsetLeft) + 'px';
					previewHost.style.top = Math.round(viewport.offsetTop) + 'px';
					previewHost.style.width = width + 'px';
					previewHost.style.height = height + 'px';
					previewFrame.style.position = 'absolute';
					previewFrame.style.width = width + 'px';
					previewFrame.style.height = height + 'px';
					previewFrame.style.left = '0';
					previewFrame.style.top = '0';
					previewFrame.style.transform = 'none';
					Object.defineProperty(window, 'innerWidth', { configurable: true, value: width });
					Object.defineProperty(window, 'innerHeight', { configurable: true, value: height });
				} else if (visualViewportWindowSize) {
					if (visualViewportWindowSize.width) Object.defineProperty(window, 'innerWidth', visualViewportWindowSize.width);
					else delete window.innerWidth;
					if (visualViewportWindowSize.height) Object.defineProperty(window, 'innerHeight', visualViewportWindowSize.height);
					else delete window.innerHeight;
					const style = visualViewportWindowSize.frameStyle;
					previewHost.classList.remove('uses-visual-viewport');
					previewHost.style.left = '';
					previewHost.style.top = '';
					previewHost.style.width = '';
					previewHost.style.height = '';
					previewFrame.style.width = style.width;
					previewFrame.style.height = style.height;
					previewFrame.style.position = style.position;
					previewFrame.style.left = style.left;
					previewFrame.style.top = style.top;
					previewFrame.style.transform = style.transform;
					visualViewportWindowSize = null;
				}
				if (notifyGodot) notifyGameResize();
			});
		}
		function exitPreview() {
			previewActive = false;
			if (savedWindowSize) {
				if (savedWindowSize.widthDescriptor) Object.defineProperty(window, 'innerWidth', savedWindowSize.widthDescriptor); else delete window.innerWidth;
				if (savedWindowSize.heightDescriptor) Object.defineProperty(window, 'innerHeight', savedWindowSize.heightDescriptor); else delete window.innerHeight;
				savedWindowSize = null;
			}
			if (Array.isArray(window.obtPreviewDefaultLogicalSize)) {
				requestLogicalSize(window.obtPreviewDefaultLogicalSize[0], window.obtPreviewDefaultLogicalSize[1]);
			}
			document.body.classList.remove('dev-preview');
			previewFrame.style.width = '';
			previewFrame.style.height = '';
			previewFrame.style.left = '';
			previewFrame.style.top = '';
			previewFrame.style.transform = '';
			previewHost.style.inset = '';
			devToolbar.classList.remove('is-visible');
			devToolbar.hidden = true;
			window.dispatchEvent(new Event('resize'));
			syncVisualViewport();
		}
		function openPreview(name = 'desktop') {
			if (!devEnabled || !previewPresets[name]) return;
			if (!previewActive) savedWindowSize = { width: window.innerWidth, height: window.innerHeight,
				widthDescriptor: Object.getOwnPropertyDescriptor(window, 'innerWidth'),
				heightDescriptor: Object.getOwnPropertyDescriptor(window, 'innerHeight') };
			previewActive = true;
			selectedPreview = name;
			document.body.classList.add('dev-preview');
			devToolbar.hidden = false;
			devToolbar.classList.add('is-visible');
			applyPreview();
			notifyGameResize();
		}
		devToolbar.querySelectorAll('[data-preview]').forEach(button => button.addEventListener('click', () => {
			if (!previewActive) return;
			selectedPreview = button.dataset.preview;
			applyPreview();
			notifyGameResize();
		}));
		document.getElementById('dev-exit').addEventListener('click', exitPreview);
		window.addEventListener('resize', () => { if (previewActive) applyPreview(); });
		if (window.visualViewport) {
			window.visualViewport.addEventListener('resize', () => syncVisualViewport(true), { passive: true });
			window.visualViewport.addEventListener('scroll', () => syncVisualViewport(true), { passive: true });
		}
		window.addEventListener('resize', () => syncVisualViewport(false), { passive: true });
		syncVisualViewport();
		window.OBTDevPreview = {
			enable() { devEnabled = true; },
			open() { openPreview(selectedPreview); },
			select(name) { if (previewActive) { selectedPreview = name; applyPreview(); notifyGameResize(); } else openPreview(name); },
			exit() { exitPreview(); },
			disable() { devEnabled = false; exitPreview(); }
		};

		function setStatus(message) {
			statusText.textContent = message;
			progressTrack.setAttribute('aria-valuetext', message);
		}
		function setProgress(current, total) {
			if (!Number.isFinite(current) || !Number.isFinite(total) || total <= 0 || current < 0) {
				progressTrack.classList.add('is-indeterminate');
				progressTrack.removeAttribute('aria-valuenow');
				progressTrack.setAttribute('aria-valuetext', statusText.textContent);
				percentText.textContent = '—';
				return;
			}
			const ratio = Math.max(0, Math.min(1, current / total));
			const percent = Math.min(99, Math.floor(ratio * 100));
			progressTrack.classList.remove('is-indeterminate');
			progressTrack.setAttribute('aria-valuenow', String(percent));
			progressTrack.setAttribute('aria-valuetext', percent + '% loaded');
			progressFill.style.width = percent + '%';
			percentText.textContent = percent + '%';
			if (ratio < .08) setStatus('Initializing engine…');
			else if (ratio < .92) setStatus('Preparing your business world…');
			else setStatus('Finalizing game assets…');
		}
		function showFailure(error) {
			console.error('Online Business Tycoon failed to initialize:', error);
			const reason = error instanceof Error ? error.message : String(error || 'Unknown loading error.');
			errorMessage.textContent = 'The game could not be loaded. ' + reason;
			errorPanel.classList.add('is-visible');
			retryButton.focus();
			setStatus('Loading failed');
			percentText.textContent = '';
			progressTrack.classList.remove('is-indeterminate');
			progressTrack.removeAttribute('aria-valuenow');
		}
		window.OBTStorageSyncPending = false;
		window.OBTSetStorageSyncPending = function (pending) {
			window.OBTStorageSyncPending = Boolean(pending);
		};
		window.addEventListener('beforeunload', function (event) {
			if (!window.OBTStorageSyncPending) return;
			event.preventDefault();
			event.returnValue = '';
		});
		async function startGame() {
			if (startAttempted) return;
			startAttempted = true;
			errorPanel.classList.remove('is-visible');
			try {
				const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
				if (missing.length) throw new Error('This browser is missing required features: ' + missing.join(', '));
				setStatus('Initializing engine…');
				const engine = new Engine(GODOT_CONFIG);
				await engine.startGame({ onProgress: setProgress });
				window.OBTFlushUserFS = function (requestId) {
					const complete = window.OBTUserFSSyncComplete;
					const sync = engine.rtenv && engine.rtenv.obtSyncUserFS;
					if (typeof complete !== 'function') return;
					if (typeof sync !== 'function') {
						complete(requestId, false, 'The Godot browser-storage flush hook is unavailable.');
						return;
					}
					Promise.resolve(sync()).then(function (error) {
						complete(requestId, !error, error ? String(error.message || error) : '');
					}).catch(function (error) {
						complete(requestId, false, String(error && error.message || error));
					});
				};
				progressTrack.classList.remove('is-indeterminate');
				progressFill.style.width = '100%';
				progressTrack.setAttribute('aria-valuenow', '100');
				progressTrack.setAttribute('aria-valuetext', '100% loaded');
				percentText.textContent = '100%';
				setStatus('Ready to play.');
				requestAnimationFrame(() => requestAnimationFrame(() => loader.classList.add('is-ready')));
			} catch (error) {
				showFailure(error);
			}
		}
		retryButton.addEventListener('click', () => window.location.reload());
		startGame();
	</script>
</body>
</html>
