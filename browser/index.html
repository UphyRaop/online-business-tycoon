<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1421"><title>Online Business Tycoon — Phase 1</title><style>
:root{color-scheme:dark;--font-caption:11px;--font-button:12px;--font-body:13px;--font-heading:14px;--bg:#0c1421;--panel:#19283b;--panel2:#223349;--gold:#e3bd7a;--text:#f3f5fa;--muted:#a5b6ca;--green:#70d4a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:var(--font-body)/1.5 system-ui,-apple-system,sans-serif}.app{max-width:560px;min-height:100dvh;margin:auto;display:flex;flex-direction:column}.header{padding:22px 18px 15px;background:#111d2e;border-bottom:1px solid #314157}.eyebrow{font-size:var(--font-caption);letter-spacing:2px;color:var(--gold);font-weight:800}.header h1{font-size:var(--font-heading);margin:5px 0 0;line-height:1.25}.main{flex:1;padding:16px 16px 110px}.card{background:var(--panel);border:1px solid #314157;border-radius:16px;padding:17px;margin-bottom:14px}.card h2{font-size:var(--font-heading);color:var(--gold);margin:0 0 13px}.muted{color:var(--muted)}.small{font-size:var(--font-button)}.big{font-size:var(--font-heading);font-weight:800;letter-spacing:-.7px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--panel2);border-radius:12px;padding:12px}.stat b{display:block;font-size:var(--font-heading);margin-top:4px}label{display:block;color:var(--muted);font-size:var(--font-button);margin:12px 0 5px}input,select{display:block;width:100%;background:#0f1b2b;border:1px solid #43546b;color:var(--text);border-radius:10px;padding:12px;font-size:var(--font-body);min-height:46px}button{background:var(--gold);color:#182335;border:0;border-radius:11px;font-size:var(--font-button);font-weight:800;padding:12px 15px;min-height:46px;cursor:pointer}button.secondary{background:var(--panel2);color:var(--text);border:1px solid #40536b}button:disabled{opacity:.45}.wide{width:100%;margin-top:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.row>*{min-width:0}.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#111d2e;border-top:1px solid #34445c;padding:10px 8px max(10px,env(safe-area-inset-bottom));z-index:2}.nav button{padding:8px 3px;background:transparent;color:var(--muted);font-size:var(--font-button);min-height:44px}.nav button.active{color:var(--gold);background:var(--panel2)}.item{border-top:1px solid #35465a;padding:12px 0}.item:first-of-type{border-top:0}.pill{display:inline-block;border-radius:100px;padding:3px 9px;background:#2b4254;color:var(--gold);font-size:var(--font-caption);font-weight:700}.success{color:var(--green)}.danger{color:#ff9a9a}.note{padding:10px;background:#2a3647;border-radius:10px;font-size:var(--font-button);color:var(--muted)}.notice{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#315b4b;padding:10px 18px;border-radius:10px;z-index:4;display:none;width:max-content;max-width:90%}</style></head><body><div class="app"><header class="header"><div class="eyebrow">ONLINE BUSINESS TYCOON · PHASE 1</div><h1 id="title">Start your business</h1></header><main class="main" id="content"></main><nav class="nav" id="nav" hidden></nav></div><div id="notice" class="notice"></div><script>
'use strict';const KEY='obt_phase1_v1';const countries=[['Malaysia','MYR',1],['United States','USD',.25],['United Kingdom','GBP',.20],['Singapore','SGD',.34],['Indonesia','IDR',3800],['China','CNY',1.7]];const products=[{name:'Portable Blender',cost:32,demand:1.1},{name:'Wireless Earbuds',cost:25,demand:1.25},{name:'Travel Organizer',cost:14,demand:.9},{name:'Desk Lamp',cost:29,demand:1},{name:'Water Bottle',cost:12,demand:1.15}];const suppliers=[{name:'Value Supply',factor:.9,quality:.85},{name:'Reliable Direct',factor:1,quality:1},{name:'Premium Partners',factor:1.2,quality:1.12}];let g=null,tab='Dashboard';const el=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);const money=n=>`${g?.currency||'MYR'} ${fmt(n)}`;const card=(name,html)=>`<section class="card"><h2>${name}</h2>${html}</section>`;const note=s=>`<p class="note">${s}</p>`;const choice=(id,items,selected=0)=>`<select id="${id}">${items.map((v,i)=>`<option value="${i}" ${i===selected?'selected':''}>${safe(v)}</option>`).join('')}</select>`;function toast(msg){let n=el('notice');n.textContent=msg;n.style.display='block';setTimeout(()=>n.style.display='none',2000)}function save(){if(!g)return;try{localStorage.setItem(KEY,JSON.stringify(g))}catch(e){toast('Saving unavailable in this browser')}}function load(){try{let v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Array.isArray(v.listings)&&v.version===1)return v}catch(e){}return null}
function setup(){g=null;el('nav').hidden=true;el('title').textContent='Create your business';el('content').innerHTML=card('Entrepreneur Setup',`<label>Entrepreneur name</label><input id="owner" value="Founder" maxlength="40"><label>Company name</label><input id="company" value="My Online Store" maxlength="50"><label>Starting country</label>${choice('country',countries.map(x=>x[0]))}<label>Difficulty</label>${choice('difficulty',['Easy — established startup','Normal — start from zero','Hard — limited savings'],1)}<label>Sales channel</label>${choice('channel',['Marketplace','Own Website','Both'])}<button class="wide" onclick="start()">REGISTER & START</button>`)+note('Registration is instant and free. This prototype uses fictionalized game costs and market conditions.');}
function start(){let c=+el('country').value,d=+el('difficulty').value,channel=+el('channel').value;let capital=[15000,5000,1500][d]*countries[c][2];g={version:1,owner:el('owner').value.trim()||'Founder',company:el('company').value.trim()||'My Online Store',country:c,currency:countries[c][1],difficulty:d,channel,cash:capital,initialCash:capital,day:1,revenue:0,costs:0,orders:0,history:[],listings:[],seed:123456789+Math.floor(Math.random()*100000)};save();open('Dashboard')}
function rand(){g.seed=(Math.imul(1664525,g.seed)+1013904223)>>>0;return g.seed/4294967296}
function open(t){tab=t;el('title').textContent=g.company;el('nav').hidden=false;el('nav').innerHTML=['Dashboard','Market','Business','Finance'].map((n,i)=>`<button class="${tab===n?'active':''}" onclick="open('${n}')">${['⌂','▦','▣','▤'][i]}<br>${n}</button>`).join('');let html='';if(t==='Dashboard')html=dashboard();if(t==='Market')html=market();if(t==='Business')html=business();if(t==='Finance')html=finance();el('content').innerHTML=html;}
function dashboard(){return card('Company Overview',`<div class="row"><span class="pill">DAY ${g.day}</span><span class="muted small">${countries[g.country][0]}</span></div><p class="muted small">AVAILABLE CASH</p><div class="big">${money(g.cash)}</div><div class="stats"><div class="stat"><span class="muted small">Revenue</span><b>${money(g.revenue)}</b></div><div class="stat"><span class="muted small">Net Profit</span><b class="${g.revenue-g.costs>=0?'success':'danger'}">${money(g.revenue-g.costs)}</b></div><div class="stat"><span class="muted small">Orders</span><b>${g.orders}</b></div><div class="stat"><span class="muted small">Listings</span><b>${g.listings.length}</b></div></div>`)+card('Advance Game Time',`<p class="muted small">Every intermediate day is simulated, including sales and operating costs.</p><div class="days">${[1,2,7,30].map(n=>`<button onclick="advance(${n})">+${n}</button>`).join('')}</div>`)+card('Your Next Move',g.listings.length?`<p>Adjust product prices, then advance days to grow your company.</p><button class="secondary wide" onclick="open('Business')">MANAGE PRODUCTS</button>`:`<p>Start by choosing a product and supplier.</p><button class="wide" onclick="open('Market')">OPEN PRODUCT MARKET</button>`)+`<button class="secondary wide" onclick="save();toast('Progress saved')">SAVE PROGRESS</button>`;}
function market(){return card('Create Product Listing',`<label>Product</label>${choice('product',products.map(p=>p.name))}<label>Supplier</label>${choice('supplier',suppliers.map(s=>s.name))}<label>Selling price (${g.currency})</label><input id="price" type="number" inputmode="decimal" min="1" step="1" value="${Math.round(99*countries[g.country][2])}"><button class="wide" onclick="listProduct()">LIST PRODUCT</button>`)+card('Available Products',products.map(p=>`<div class="item"><div class="row"><b>${p.name}</b><span class="pill">Cost ${money(p.cost*countries[g.country][2])}</span></div><span class="muted small">Demand index: ${p.demand.toFixed(2)}</span></div>`).join(''))+note('Supplier cost and quality influence margins and sales. The same product can be repriced or assigned a different supplier.');}
function listProduct(){let product=+el('product').value,supplier=+el('supplier').value,price=Number(el('price').value);if(!Number.isFinite(price)||price<=0){toast('Enter a valid selling price');return}let existing=g.listings.find(l=>l.product===product);if(existing){existing.supplier=supplier;existing.price=price}else g.listings.push({product,supplier,price,orders:0,revenue:0});save();open('Business');toast('Product listing saved')}
function business(){return card('Sales Channel',`<b>${['Marketplace','Own Website','Both'][g.channel]}</b><p class="muted small">Marketplace: 12% fee. Website: 4% fee plus daily hosting. Both: 8% blended fee plus hosting.</p>`)+card('Active Listings',g.listings.length?g.listings.map(l=>{let p=products[l.product],s=suppliers[l.supplier];return `<div class="item"><b>${p.name}</b><p class="muted small">Supplier: ${s.name}<br>Unit cost: ${money(p.cost*s.factor*countries[g.country][2])}<br>Price: ${money(l.price)} · Orders: ${l.orders}</p><button class="secondary" onclick="edit(${l.product})">EDIT LISTING</button></div>`}).join(''):`<p class="muted">No active products yet.</p>`)+`<button class="wide" onclick="open('Market')">ADD OR UPDATE PRODUCT</button>`;}
function edit(product){open('Market');el('product').value=product;let l=g.listings.find(x=>x.product===product);el('supplier').value=l.supplier;el('price').value=l.price;}
function finance(){return card('Lifetime Financial Summary',`<div class="stats"><div class="stat"><span class="muted small">Revenue</span><b>${money(g.revenue)}</b></div><div class="stat"><span class="muted small">Expenses</span><b>${money(g.costs)}</b></div><div class="stat"><span class="muted small">Net Profit</span><b>${money(g.revenue-g.costs)}</b></div><div class="stat"><span class="muted small">Orders</span><b>${g.orders}</b></div></div>`)+card('Daily History',g.history.length?g.history.slice(-20).reverse().map(h=>`<div class="item"><div class="row"><b>Day ${h.day}</b><span class="pill">${h.orders} orders</span></div><span class="muted small">Revenue ${money(h.revenue)} · Costs ${money(h.costs)}</span><div class="${h.profit>=0?'success':'danger'}">Profit ${money(h.profit)}</div></div>`).join(''):`<p class="muted">Advance time to create reports.</p>`)+`<button class="secondary wide" onclick="save();toast('Progress saved')">SAVE PROGRESS</button>`;}
function advance(days){let scale=countries[g.country][2],fee=[.12,.04,.08][g.channel],traffic=[1,.72,1.25][g.channel];for(let d=0;d<days;d++){let revenue=0,costs=(g.channel===0?0:8)*scale+[4,6,9][g.difficulty]*scale,orders=0;for(let l of g.listings){let p=products[l.product],s=suppliers[l.supplier],cost=p.cost*s.factor*scale,fair=cost*2.7,priceEffect=Math.min(1.8,Math.max(.2,fair/Math.max(1,l.price))),expected=2*p.demand*s.quality*priceEffect*traffic;let count=Math.floor(expected)+(rand()<expected%1?1:0)+(rand()<.2?1:0);let available=Math.max(0,g.cash+revenue-costs);count=Math.min(count,Math.floor(available/Math.max(1,cost)));let sale=count*l.price;revenue+=sale;costs+=count*cost+sale*fee;orders+=count;l.orders+=count;l.revenue+=sale}g.cash+=revenue-costs;g.revenue+=revenue;g.costs+=costs;g.orders+=orders;g.history.push({day:g.day,revenue,costs,profit:revenue-costs,orders});g.day++}save();open('Dashboard');toast(`Advanced ${days} day${days>1?'s':''}`)}
if((g=load()))open('Dashboard');else setup();
</script></body></html>
